<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywna Prezentacja 3D - Afryka</title>
    <!-- Biblioteka Globe.gl -->
    <script src="https://unpkg.com/globe.gl"></script>
    <!-- Biblioteka PeerJS do połączeń bezpośrednich na żywo -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
            transition: opacity 0.8s ease;
        }
        #country-interior {
            position: fixed;
            inset: 0;
            background-color: #0f172a;
            background-size: cover;
            background-position: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease, transform 6s ease-out;
            transform: scale(1.15);
            z-index: 5;
        }
        #country-interior.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        #country-interior::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(2, 6, 23, 0.95) 15%, rgba(2, 6, 23, 0.2) 60%, rgba(2, 6, 23, 0.5) 100%);
        }
        .ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            transition: all 0.4s ease;
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 1.25rem;
            color: #38bdf8;
        }
        p {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #cbd5e1;
        }
        .controls {
            display: none; /* Domyślnie ukryte dla klasy */
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            background: #38bdf8;
            color: #020617;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        .live-badge {
            display: inline-block;
            font-size: 0.75rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .country-pin {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="globeViz"></div>
    <div id="country-interior"></div>

    <div class="ui-overlay">
        <div class="live-badge" id="status-badge">🔴 P2P • Oczekiwanie na połączenie...</div>
        <h2 id="slide-title">Planeta Ziemia</h2>
        <p id="slide-desc">Trwa łączenie z prezentacją...</p>
        
        <!-- Przyciski widoczne tylko dla Ciebie -->
        <div class="controls" id="presenter-controls">
            <button onclick="changeStep(-1)">Wstecz</button>
            <button onclick="changeStep(1)">Dalej</button>
        </div>
    </div>

    <script>
        // STAŁE KONFIGURACJE
        const SECRET_PIN = '1234'; // Twój tajny PIN w linku
        const MASTER_PEER_ID = 'geografia-afryka-prowadzacy-unikalny-id-9988'; // Unikalny identyfikator pokoju

        const TARGET_COUNTRY = {
            iso: 'EGY',
            name: 'Egipt',
            flagUrl: 'https://flagcdn.com/w80/eg.png',
            lat: 26.8206,
            lng: 30.8025,
            interiorImage: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/All_Gizah_Pyramids.jpg/1280px-All_Gizah_Pyramids.jpg'
        };

        const preloadImg = new Image();
        preloadImg.src = TARGET_COUNTRY.interiorImage;

        let countriesData = [];
        let currentStep = 0;
        const maxSteps = 3;
        let peer = null;
        let connections = []; // Lista połączeń (dla prezentera)
        let hostConnection = null; // Połączenie do szefa (dla ucznia)

        // Sprawdzamy czy to Ty (Prezenter)
        const urlParams = new URLSearchParams(window.location.search);
        const isPresenter = urlParams.get('pilot'] === SECRET_PIN || urlParams.get('pilot') === SECRET_PIN; // zabezpieczenie literowe

        if (urlParams.get('pilot') === SECRET_PIN) {
            document.getElementById('presenter-controls').style.display = 'flex';
            document.getElementById('status-badge').innerText = '👑 TRYB PREZENTERA (Sterujesz klasą)';
            document.getElementById('status-badge').style.color = '#fbbf24';
        }

        // Inicjalizacja globusa 3D
        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .pointOfView({ lat: 10, lng: 20, altitude: 2.5 });

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.8;

        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(data => { countriesData = data.features; });

        // Funkcja renderująca widok na ekranie
        function renderScene(step) {
            const title = document.getElementById('slide-title');
            const desc = document.getElementById('slide-desc');
            const interior = document.getElementById('country-interior');

            if (step < 3) {
                interior.classList.remove('active');
            }

            if (step === 0) {
                title.innerText = "Planeta Ziemia";
                desc.innerText = isPresenter ? "Kliknij „Dalej”, aby przenieść wszystkich do wybranego kraju." : "Prezentacja gotowa. Oczekiwanie na start...";
                world.polygonsData([]);
                world.htmlElementsData([]);
                world.controls().autoRotate = true;
                world.pointOfView({ lat: 10, lng: 20, altitude: 2.5 }, 1500);
            } 
            else if (step === 1) {
                title.innerText = `Kierunek: ${TARGET_COUNTRY.name}`;
                desc.innerText = "Zbliżenie na region, wyznaczenie granic państwowych oraz lokalizacja.";
                world.controls().autoRotate = false;

                world.pointOfView({ lat: 15, lng: TARGET_COUNTRY.lng - 180, altitude: 2.2 }, 1200);

                setTimeout(() => {
                    world.pointOfView({ lat: TARGET_COUNTRY.lat, lng: TARGET_COUNTRY.lng, altitude: 0.9 }, 1800);

                    const selected = countriesData.filter(d => d.properties.ADM0_A3 === TARGET_COUNTRY.iso);
                    world
                        .polygonsData(selected)
                        .polygonCapColor(() => 'rgba(56, 189, 248, 0.25)')
                        .polygonSideColor(() => 'rgba(56, 189, 248, 0.6)')
                        .polygonStrokeColor(() => '#38bdf8')
                        .polygonAltitude(0.02);

                    setTimeout(() => {
                        world
                            .htmlElementsData([TARGET_COUNTRY])
                            .htmlElement(d => {
                                const el = document.createElement('div');
                                el.innerHTML = `<div class="country-pin"><img src="${d.flagUrl}" width="24"> ${d.name}</div>`;
                                return el;
                            });
                    }, 1400);
                }, 1200);
            }
            else if (step === 2) {
                world.pointOfView({ lat: TARGET_COUNTRY.lat, lng: TARGET_COUNTRY.lng, altitude: 0.9 }, 1200);
                title.innerText = "Środowisko i gospodarka";
                desc.innerText = "Informacje z podręcznika o tym państwie.";
            }
            else if (step === 3) {
                title.innerText = `Wewnątrz: ${TARGET_COUNTRY.name}`;
                desc.innerText = "Krajobraz, kultura i najciekawsze miejsca regionu.";
                
                world.pointOfView({ lat: TARGET_COUNTRY.lat, lng: TARGET_COUNTRY.lng, altitude: 0.12 }, 1200);

                setTimeout(() => {
                    interior.style.backgroundImage = `url('${TARGET_COUNTRY.interiorImage}')`;
                    interior.classList.add('active');
                }, 900);
            }
        }

        // --- KONFIGURACJA SIECI P2P (PeerJS) ---
        if (isPresenter) {
            // Twój telefon zakłada "pokój" jako główny serwer
            peer = new Peer(MASTER_PEER_ID);

            peer.on('open', () => {
                document.getElementById('status-badge').innerText = '👑 PILOT AKTYWNY (Połączono z siecią)';
                renderScene(currentStep);
            });

            // Gdy ktoś z klasy wchodzi na stronę, podłącza się do Ciebie
            peer.on('connection', (conn) => {
                connections.push(conn);
                // Wyślij mu aktualny krok na powitanie
                conn.on('open', () => {
                    conn.send({ step: currentStep });
                });
            });

            peer.on('error', (err) => {
                console.error("Błąd pilota:", err);
                // Jeśli ID jest zajęte, spróbuj otworzyć bez stałego ID lub zresetuj
            });

        } else {
            // Telefon ucznia łączy się do Twojego telefonu
            peer = new Peer();

            peer.on('open', () => {
                const conn = peer.connect(MASTER_PEER_ID);
                hostConnection = conn;

                conn.on('open', () => {
                    document.getElementById('status-badge').innerText = '🟢 POŁĄCZONO NA ŻYWO';
                });

                // Odbieranie zmian slajdów od Ciebie
                conn.on('data', (data) => {
                    if (typeof data.step === 'number') {
                        currentStep = data.step;
                        renderScene(currentStep);
                    }
                });

                conn.on('close', () => {
                    document.getElementById('status-badge').innerText = '🔴 ROZŁĄCZONO (Oczekiwanie...)';
                });
            });
        }

        // Funkcja zmiany slajdu (tylko dla Ciebie)
        function changeStep(delta) {
            if (!isPresenter) return;
            
            currentStep += delta;
            if (currentStep < 0) currentStep = 0;
            if (currentStep > maxSteps) currentStep = maxSteps;

            // Renderuj u siebie
            renderScene(currentStep);

            // Rozślij nowy krok do wszystkich połączonych uczniów w ułamku sekundy!
            connections.forEach(conn => {
                if (conn.open) {
                    conn.send({ step: currentStep });
                }
            });
        }

        // Startowy widok
        renderScene(0);
    </script>
</body>
</html>
