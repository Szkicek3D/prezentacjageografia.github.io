<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywna Prezentacja 3D - Afryka</title>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
            transition: opacity 0.8s ease;
        }
        /* Pełnoekranowy widok po "wejściu" w kraj */
        #country-interior {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease, transform 6s ease-out;
            transform: scale(1.15);
            z-index: 5;
        }
        #country-interior.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        /* Przyciemnienie u dołu zdjęcia dla czytelności tekstu */
        #country-interior::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(2, 6, 23, 0.95) 15%, rgba(2, 6, 23, 0.2) 60%, rgba(2, 6, 23, 0.5) 100%);
        }
        /* Karta z treścią slajdu na dole ekranu */
        .ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            transition: all 0.4s ease;
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 1.25rem;
            color: #38bdf8;
        }
        p {
            margin: 0 0 15px 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #cbd5e1;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            background: #38bdf8;
            color: #020617;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        .country-pin {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="globeViz"></div>
    <!-- Warstwa wnętrza kraju (zdjęcie w wysokiej jakości) -->
    <div id="country-interior"></div>

    <div class="ui-overlay">
        <h2 id="slide-title">Planeta Ziemia</h2>
        <p id="slide-desc">Kliknij „Dalej”, aby wykonać obrót i przenieść się do wybranego kraju w Afryce.</p>
        <div class="controls">
            <button onclick="prevStep()">Wstecz</button>
            <button onclick="nextStep()">Dalej</button>
        </div>
    </div>

    <script>
        // --- KONFIGURACJA TWOJEGO KRAJU ---
        const TARGET_COUNTRY = {
            iso: 'EGY',
            name: 'Egipt',
            flagUrl: 'https://flagcdn.com/w80/eg.png',
            lat: 26.8206,
            lng: 30.8025,
            // Zdjęcie krajobrazu po "wejściu" do kraju (tu: Egipt / Piramidy i Nil z Unsplash)
            interiorImage: 'https://images.unsplash.com/photo-1539650116574-8efeb43e2750?auto=format&fit=crop&w=1600&q=80'
        };

        let countriesData = [];
        let step = 0;
        const maxSteps = 3;

        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .pointOfView({ lat: 10, lng: 20, altitude: 2.5 });

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.8;

        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(data => {
                countriesData = data.features;
            });

        function updateScene() {
            const title = document.getElementById('slide-title');
            const desc = document.getElementById('slide-desc');
            const interior = document.getElementById('country-interior');

            // Reset widoku wnętrza przy cofaniu
            if (step < 3) {
                interior.classList.remove('active');
            }

            if (step === 0) {
                title.innerText = "Planeta Ziemia";
                desc.innerText = "Kliknij „Dalej”, aby wykonać obrót i przenieść się do wybranego kraju.";
                world.polygonsData([]);
                world.htmlElementsData([]);
                world.controls().autoRotate = true;
                world.pointOfView({ lat: 10, lng: 20, altitude: 2.5 }, 1500);
            } 
            else if (step === 1) {
                title.innerText = `Kierunek: ${TARGET_COUNTRY.name}`;
                desc.innerText = "Zbliżenie na region, wyznaczenie granic państwowych oraz lokalizacja.";
                world.controls().autoRotate = false;

                world.pointOfView({ lat: 15, lng: TARGET_COUNTRY.lng - 180, altitude: 2.2 }, 1200);

                setTimeout(() => {
                    world.pointOfView({ 
                        lat: TARGET_COUNTRY.lat, 
                        lng: TARGET_COUNTRY.lng, 
                        altitude: 0.9 
                    }, 1800);

                    const selected = countriesData.filter(d => d.properties.ADM0_A3 === TARGET_COUNTRY.iso);
                    world
                        .polygonsData(selected)
                        .polygonCapColor(() => 'rgba(56, 189, 248, 0.25)')
                        .polygonSideColor(() => 'rgba(56, 189, 248, 0.6)')
                        .polygonStrokeColor(() => '#38bdf8')
                        .polygonAltitude(0.02);

                    setTimeout(() => {
                        world
                            .htmlElementsData([TARGET_COUNTRY])
                            .htmlElement(d => {
                                const el = document.createElement('div');
                                el.innerHTML = `<div class="country-pin"><img src="${d.flagUrl}" width="24"> ${d.name}</div>`;
                                return el;
                            });
                    }, 1400);
                }, 1200);
            }
            else if (step === 2) {
                // Powrót do widoku z orbity (jeśli ktoś wraca ze slajdu 3)
                world.pointOfView({ 
                    lat: TARGET_COUNTRY.lat, 
                    lng: TARGET_COUNTRY.lng, 
                    altitude: 0.9 
                }, 1200);
                title.innerText = "Środowisko i gospodarka";
                desc.innerText = "Tutaj wpiszesz informacje z podręcznika. Kliknij „Dalej”, aby zanurkować w głąb kraju!";
            }
            else if (step === 3) {
                // KROK 3: Mocne zbliżenie (nurkowanie w głąb kraju) i wejście na poziom ziemi
                title.innerText = `Wewnątrz: ${TARGET_COUNTRY.name}`;
                desc.innerText = "Jesteśmy na miejscu! Tutaj możesz opowiedzieć o kulturze, krajobrazie lub najważniejszych atrakcjach.";
                
                // 1. Kamera nurkuje tuż nad powierzchnię globusa (altitude: 0.04)
                world.pointOfView({ 
                    lat: TARGET_COUNTRY.lat, 
                    lng: TARGET_COUNTRY.lng, 
                    altitude: 0.04 
                }, 1400);

                // 2. W momencie, gdy kamera "przebija" chmury, płynnie wchodzi krajobraz kraju
                setTimeout(() => {
                    interior.style.backgroundImage = `url('${TARGET_COUNTRY.interiorImage}')`;
                    interior.classList.add('active');
                }, 1000);
            }
        }

        function nextStep() {
            if (step < maxSteps) {
                step++;
                updateScene();
            }
        }

        function prevStep() {
            if (step > 0) {
                step--;
                updateScene();
            }
        }
    </script>
</body>
</html>
